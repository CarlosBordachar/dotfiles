include=~/.config/fuzzel/themes/catppuccin-macchiato/mauve.ini

dpi-aware=no
icon-theme=Papirus-Dark
width=35
font=monospace:weight=normal:size=14
line-height=20
fields=name,generic,comment,categories,filename,keywords
terminal=foot -e
prompt="❯   "
show-actions=yes
exit-on-keyboard-focus-loss=no

[border]
radius=8
width=3
selection-radius=4

[dmenu]
exit-immediately-if-empty=yes

